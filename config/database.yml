default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: comments_app_development

test:
  <<: *default
  database: comments_app_test

production:
  <<: *default
  database: comments_app_production
  username: comments_app
  password: <%= ENV["COMMENTS_APP_DATABASE_PASSWORD"] %>
